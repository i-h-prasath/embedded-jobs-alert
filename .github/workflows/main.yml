name: Embedded Jobs 3x Daily
on:
  schedule:
    - cron: '30 4,9,14 * * *'  # 10AM, 3PM, 8PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python jobs.py
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
      - name: Save seen history
        run: |
          git config user.name "jobs-bot"
          git config user.email "jobs-bot@github.com"
          git add seen.json || true
          git commit -m "update seen $(date -u)" || echo "no changes"
          git push || true
